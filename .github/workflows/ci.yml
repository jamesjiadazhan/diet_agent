name: Local toolkit validation
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: diet-assess data install --file data/generic-fndds-2021-2023-v1.sqlite.gz --destination data/generic-fndds-2021-2023-v1.sqlite
      - run: python -m unittest discover -s tests -v
      - run: diet-assess analyze examples/meal.json --database data/generic-fndds-2021-2023-v1.sqlite
